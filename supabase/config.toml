[project]
id = "margined"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://app.trymargined.com"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Gateway JWT checks are disabled because these jobs use a dedicated CRON_SECRET.
# Both entrypoints must be wrapped in withCronAuth before any service-role work.
[functions.hourly-rollup]
verify_jwt = false

[functions.daily-alerts]
verify_jwt = false
